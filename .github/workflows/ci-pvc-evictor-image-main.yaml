name: CI - PVC Evictor Image (Main)

# Merged PR builds: pushed to ghcr.io with cosign signing on every merge to
# main that touches the pvc-evictor code. Tag: sha-<short sha of the merged
# commit> so every merged commit has a corresponding image.

on:
  push:
    branches:
      - main
    paths:
      - 'kv_connectors/pvc_evictor/**'
      - '.github/workflows/ci-pvc-evictor-image-main.yaml'

permissions:
  contents: read
  packages: write
  id-token: write  # for cosign keyless signing

env:
  PRODUCTION_REGISTRY: ghcr.io

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set tag name
        id: tag
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRODUCTION_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: kv_connectors/pvc_evictor
          file: kv_connectors/pvc_evictor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ${{ env.PRODUCTION_REGISTRY }}/${{ github.repository_owner }}/pvc-evictor:sha-${{ steps.tag.outputs.short_sha }}

      - name: Run Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ env.PRODUCTION_REGISTRY }}/${{ github.repository_owner }}/pvc-evictor:sha-${{ steps.tag.outputs.short_sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.PRODUCTION_REGISTRY }}/${{ github.repository_owner }}/pvc-evictor@${{ steps.build-and-push.outputs.digest }}
