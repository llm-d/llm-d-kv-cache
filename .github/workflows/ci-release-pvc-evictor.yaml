name: CI - Release - PVC Evictor Image

# Release builds: pushed to ghcr.io with cosign signing whenever a v* tag is
# cut. Tag: the semver version stripped of the leading "v" (e.g. v0.1.0 -> 0.1.0).
# `latest` is only refreshed when a real (non-prerelease) GitHub Release is
# published, so the chart's `image.tag: latest` default always resolves.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write  # for cosign keyless signing

env:
  PRODUCTION_REGISTRY: ghcr.io

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Determine image tags
        id: tag
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          # Strip leading "v" to get a valid semver version (v0.1.0 -> 0.1.0)
          SEMVER="${TAG#v}"
          if ! [[ "${SEMVER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${TAG}' is not valid semver" >&2
            exit 1
          fi
          echo "tag=${SEMVER}" >> "$GITHUB_OUTPUT"
          IMAGE="${PRODUCTION_REGISTRY}/${REPOSITORY_OWNER}/llm-d-pvc-evictor"
          TAGS="${IMAGE}:${SEMVER}"
          # Only refresh `latest` on a real (non-prerelease) GitHub Release so
          # tag-only pushes do not bump the floating tag.
          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${PRERELEASE}" == "false" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          PRODUCTION_REGISTRY: ${{ env.PRODUCTION_REGISTRY }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PRERELEASE: ${{ github.event.release.prerelease }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRODUCTION_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile COPYs paths relative to kv_connectors/ (pvc_evictor/
          # and llmd_fs_backend/), so the build context must be kv_connectors.
          context: kv_connectors
          file: kv_connectors/pvc_evictor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: ${{ steps.tag.outputs.tags }}

      - name: Run Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ env.PRODUCTION_REGISTRY }}/${{ github.repository_owner }}/llm-d-pvc-evictor:${{ steps.tag.outputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.PRODUCTION_REGISTRY }}/${{ github.repository_owner }}/llm-d-pvc-evictor@${{ steps.build-and-push.outputs.digest }}
